name: Sync cask with latest ClipLite release

# 为什么不用 PAT：本工作流跑在 tap 仓库里，用自己的 GITHUB_TOKEN 读 ClipLite 的
# **公开** Release 并写回本仓库，因此不需要任何跨仓库凭据（也就不用把个人 token
# 存进 ClipLite 的 Actions secrets）。
# 代价是「拉」模型有延迟：每 2 小时轮询一次；想立刻同步可在 Actions 页手动 Run workflow。
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cask
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask if a newer release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/L14nY1Wang/ClipLite/releases/latest)
          VER=$(printf '%s' "$REL" | python3 -c 'import sys,json;print(json.load(sys.stdin)["tag_name"].lstrip("v"))')
          SHA=$(printf '%s' "$REL" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(((a.get("digest") or "").replace("sha256:","") for a in d.get("assets",[]) if a["name"].endswith(".dmg")),""))')
          if [ -z "$VER" ] || [ -z "$SHA" ]; then
            echo "::error::无法从 ClipLite Release 解析出版本或 DMG 摘要"
            exit 1
          fi
          echo "ClipLite latest = $VER / $SHA"
          sed -i -E "s/^  version \".*\"/  version \"$VER\"/" Casks/cliplite.rb
          sed -i -E "s/^  sha256 arm: \".*\"/  sha256 arm: \"$SHA\"/" Casks/cliplite.rb
          grep -E '^  (version|sha256 arm)' Casks/cliplite.rb
          if git diff --quiet; then
            echo "cask 已是最新，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cliplite $VER"
          git push
